<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Web Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; display: flex; flex-direction: column; }
    .nav-bar { display: flex; padding: 8px; background: #1e1e1e; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2d2d2d; color: #fff; font-size: 14px; }
    button { padding: 10px 18px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0052a3; }
    iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <input type="text" id="targetUrl" placeholder="Enter full URL (e.g., https://example.com)">
    <button onclick="navigate()">Go</button>
  </div>

  <iframe id="displayFrame"></iframe>

  <script>
    function navigate() {
      let url = document.getElementById('targetUrl').value.trim();
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      document.getElementById('displayFrame').src = '/fetch?url=' + encodeURIComponent(url);
    }

    // Allow pressing Enter in the URL bar
    document.getElementById('targetUrl').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') navigate();
    });
  </script>

</body>
</html>
